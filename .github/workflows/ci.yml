

name: Tinder

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - bugfix/**

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Lint Code
      - name: Run ESLint
        run: npm run lint

      # Step 5: Run Tests
      - name: Run Tests
        run: npm test

      # Step 6: Build Project
      - name: Build Project
        run: npm run build
