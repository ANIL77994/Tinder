name: Tinder_CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run Linter
      - name: Run Linter
        run: npm run lint

      # Step 5: Run API Tests
      - name: Run API Tests
        run: npm test
        env:
          CI: true
          NODE_ENV: test
          SECRATEKEY: ci_test_secret_key_123

      # Step 6: Build Project
      - name: Build Project
        run: npm run build